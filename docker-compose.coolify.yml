# Garden View on a server managed by Coolify (e.g. the Hostinger "Coolify" VPS image).
# Coolify's own proxy provides the domain, HTTPS and certificates, so there is no Caddy here
# and nothing publishes ports 80/443. In Coolify: New Resource -> your GitHub repository ->
# Build Pack "Docker Compose" -> Docker Compose Location "/docker-compose.coolify.yml",
# then give the `app` service the domain  https://<your domain>:4000  (4000 = the app's port).
# Fill the environment variables Coolify lists (POSTGRES_PASSWORD, JWT_SECRET, DOMAIN, ...).
# For a plain VPS without Coolify, use docker-compose.yml instead (see DEPLOY.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garden_view
      POSTGRES_DB: garden_view
      # required: Coolify shows these as required variables and refuses to deploy without them
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garden_view -d garden_view']
      interval: 5s
      timeout: 5s
      retries: 20
      # the first start initialises the database; failed checks during this window don't count
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '4000'
    environment:
      DATABASE_URL: postgresql://garden_view:${POSTGRES_PASSWORD:?}@db:5432/garden_view
      JWT_SECRET: ${JWT_SECRET:?}
      # optional: the first admin, created on start only while no admin exists (remove after)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # owners' listing photos: user content, kept outside the image
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
